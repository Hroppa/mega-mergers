<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merger Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="sectors-container">
            <div class="sector" id="consumption-investment">
                <h2>Consumption & Investment</h2>
            </div>
            <div class="sector" id="raw-factors">
                <h2>Raw Factors</h2>
                <ul>
                    <li>Land</li>
                    <li>Labour</li>
                    <li>Energy</li>
                </ul>
            </div>
            <div class="sector" id="manufacturing">
                <h2>Manufacturing</h2>
                <ul>
                    <li>Groceries</li>
                    <li>Hardware</li>
                    <li>Pharma</li>
                </ul>
            </div>
            <div class="sector" id="retail">
                <h2>Retail</h2>
                <ul>
                    <li>Retail</li>
                    <li>Healthcare</li>
                    <li>Entertainment</li>
                </ul>
            </div>
        </div>
        <div id="merger-proposals-container">
            <h2>Merger Proposals</h2>
            <div id="mergers">
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
